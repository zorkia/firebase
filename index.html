
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Realtime Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --text:#18212f; --muted:#6b7280; --border:#e5e7eb;
  --temp:#ef4444; --humi:#3b82f6; --light:#f59e0b; --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1400px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
h1{margin:0;font-size:clamp(24px,4vw,36px)}
.sub{color:var(--muted);margin-top:5px}
.status{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px #16a34a20}
.dot.bad{background:var(--bad)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.card,.chart-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}
.label{font-size:14px;color:var(--muted);font-weight:600}
.value{font-size:clamp(32px,5vw,52px);font-weight:750;line-height:1.15;margin-top:8px}
.unit{font-size:.45em;color:var(--muted);font-weight:600}
.temp .value{color:var(--temp)} .humi .value{color:var(--humi)} .light .value{color:var(--light)}
.charts{display:grid;grid-template-columns:1fr;gap:16px}
.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.chart-title{font-size:17px;font-weight:700}
canvas{width:100%!important;height:250px!important}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;margin-top:16px}
@media(max-width:760px){.wrap{padding:14px}.metrics{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.status{align-self:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>ESP32 Realtime Dashboard</h1>
    <div class="sub">Firebase Realtime Database · esp32-01</div>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting...</span></div>
</header>

<section class="metrics">
  <div class="card temp"><div class="label">TEMPERATURE</div><div class="value"><span id="temp">--</span> <span class="unit">°C</span></div></div>
  <div class="card humi"><div class="label">HUMIDITY</div><div class="value"><span id="humi">--</span> <span class="unit">%</span></div></div>
  <div class="card light"><div class="label">LIGHT</div><div class="value"><span id="light">--</span> <span class="unit">lx</span></div></div>
</section>

<section class="charts">
  <div class="chart-card"><div class="chart-head"><div class="chart-title">Temperature</div><div class="label">°C</div></div><canvas id="tempChart"></canvas></div>
  <div class="chart-card"><div class="chart-head"><div class="chart-title">Humidity</div><div class="label">%</div></div><canvas id="humiChart"></canvas></div>
  <div class="chart-card"><div class="chart-head"><div class="chart-title">Light</div><div class="label">lux</div></div><canvas id="lightChart"></canvas></div>
</section>

<footer><span id="updated">Last update: --</span><span>Auto refresh every 2 seconds · Latest 60 points</span></footer>
</div>

<script>
const BASE = 'https://iot-000-760f8-default-rtdb.asia-southeast1.firebasedatabase.app';
const LATEST_URL = BASE + '/lab/esp32-01/latest.json';
const HISTORY_URL = BASE + '/lab/esp32-01/history.json';
const MAX_POINTS = 60;
const REFRESH_MS = 2000;

const $ = id => document.getElementById(id);
let lastTimestamp = null;

function makeChart(id, label, color) {
  return new Chart($(id), {
    type: 'line',
    data: { labels: [], datasets: [{
      label, data: [], borderColor: color, backgroundColor: color + '18',
      borderWidth: 2, pointRadius: 1.5, pointHoverRadius: 4, tension: .3, fill: true
    }]},
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:8,color:'#6b7280'}},
        y:{beginAtZero:false,ticks:{color:'#6b7280'},grid:{color:'#e5e7eb80'}}
      }
    }
  });
}

const tempChart = makeChart('tempChart','Temperature','#ef4444');
const humiChart = makeChart('humiChart','Humidity','#3b82f6');
const lightChart = makeChart('lightChart','Light','#f59e0b');

function n(v){ const x=Number(v); return Number.isFinite(x)?x:null; }
function fmt(v,d=2){ return v===null?'--':v.toFixed(d); }

function parseTime(ts) {
  if (ts == null) return null;
  let x = Number(ts);
  if (!Number.isFinite(x)) return null;
  if (x < 1e12) x *= 1000;
  return new Date(x);
}
function timeLabel(ts) {
  const d=parseTime(ts);
  return d && !isNaN(d) ? d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
}

function normalizeHistory(obj) {
  if (!obj) return [];
  const rows = Array.isArray(obj) ? obj.filter(Boolean) : Object.values(obj);
  return rows.map((r,i)=>({
    temp:n(r.temp), humi:n(r.humi), light:n(r.light),
    timestamp:r.timestamp ?? i
  })).filter(r=>r.temp!==null || r.humi!==null || r.light!==null)
    .sort((a,b)=>(Number(a.timestamp)||0)-(Number(b.timestamp)||0))
    .slice(-MAX_POINTS);
}

function setChart(chart, rows, key) {
  chart.data.labels = rows.map(r=>timeLabel(r.timestamp));
  chart.data.datasets[0].data = rows.map(r=>r[key]);
  chart.update('none');
}

async function loadHistory() {
  const res = await fetch(HISTORY_URL + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error('History HTTP ' + res.status);
  const rows = normalizeHistory(await res.json());
  setChart(tempChart,rows,'temp'); setChart(humiChart,rows,'humi'); setChart(lightChart,rows,'light');
}

function appendPoint(data) {
  const ts = data.timestamp ?? Date.now();
  if (String(ts) === String(lastTimestamp)) return;
  lastTimestamp = ts;
  const label=timeLabel(ts);
  [[tempChart,'temp'],[humiChart,'humi'],[lightChart,'light']].forEach(([chart,key])=>{
    chart.data.labels.push(label);
    chart.data.datasets[0].data.push(n(data[key]));
    if(chart.data.labels.length>MAX_POINTS){chart.data.labels.shift();chart.data.datasets[0].data.shift();}
    chart.update('none');
  });
}

async function loadLatest() {
  try {
    const res=await fetch(LATEST_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('Latest HTTP '+res.status);
    const d=await res.json();
    if(!d) throw new Error('No latest data');

    const t=n(d.temp), h=n(d.humi), l=n(d.light);
    $('temp').textContent=fmt(t); $('humi').textContent=fmt(h); $('light').textContent=fmt(l);
    appendPoint(d);

    const dt=parseTime(d.timestamp);
    $('updated').textContent='Last update: '+(dt&&!isNaN(dt)?dt.toLocaleString('th-TH'):new Date().toLocaleString('th-TH'));
    $('dot').className='dot ok'; $('statusText').textContent='Connected';
  } catch(e) {
    $('dot').className='dot bad'; $('statusText').textContent='Connection error';
    console.error(e);
  }
}

async function init(){
  try{ await loadHistory(); }catch(e){ console.warn(e); }
  await loadLatest();
  setInterval(loadLatest,REFRESH_MS);
}
init();
</script>
</body>
</html>
